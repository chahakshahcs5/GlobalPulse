name: CI/CD Pipeline - GlobalPulse

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  JWT_SECRET: ci-test-secret-key-that-is-at-least-32-characters-long-for-testing
  DATABASE_URL: postgresql://news_admin:news_secure_password@localhost:5432/globalpulse_test
  REDIS_URL: redis://localhost:6379

jobs:
  validate:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Prettier format check
        run: pnpm exec prettier --check "**/*.{ts,tsx,json,md}"

      - name: Linter check
        run: pnpm run lint

  test:
    name: Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: validate
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: news_admin
          POSTGRES_PASSWORD: news_secure_password
          POSTGRES_DB: globalpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm run test:unit

      - name: Run Integration Tests
        run: pnpm run test:integration

  build:
    name: Build All Monorepo Targets
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.3.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications and libraries
        run: pnpm run build
