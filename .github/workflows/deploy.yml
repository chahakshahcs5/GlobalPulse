name: Deploy GlobalPulse to phleet

# Runs after the CI workflow succeeds on main, then asks phleet to deploy the
# exact commit that passed CI.
#
# phleet serialises builds on one phone and times out a deployment after 20
# minutes. A single stack deploy creates all five deployments at once, so the
# queued ones age out before they start. Deploy the services one at a time so
# each gets its own 20-minute window.
#
# Repository secrets:   PHLEET_URL, PHLEET_DEPLOY_TOKEN
# Repository variable:  PHLEET_PROJECT_ID  (the GlobalPulse stack id)
#
# The phleet token must have the deployer role. Do not use the admin token.

on:
  workflow_run:
    workflows: ['CI/CD Pipeline - GlobalPulse']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to deploy (defaults to the selected branch)
        required: false
        type: string

concurrency:
  group: phleet-globalpulse-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy stack
    runs-on: ubuntu-latest
    # Five services, each with its own 20-minute phleet window.
    timeout-minutes: 120
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    env:
      PHLEET_URL: ${{ secrets.PHLEET_URL }}
      PHLEET_TOKEN: ${{ secrets.PHLEET_DEPLOY_TOKEN }}
      PHLEET_PROJECT_ID: ${{ vars.PHLEET_PROJECT_ID }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
    steps:
      - name: Ensure stack addons are running
        run: |
          set -euo pipefail
          test -n "$PHLEET_URL" || { echo "PHLEET_URL is not set"; exit 1; }
          test -n "$PHLEET_TOKEN" || { echo "PHLEET_DEPLOY_TOKEN is not set"; exit 1; }
          test -n "$PHLEET_PROJECT_ID" || { echo "PHLEET_PROJECT_ID is not set"; exit 1; }

          # Starting the stack also starts its databases and caches. It can
          # return 409 when a child has no release yet; the deploy below builds
          # those children, so only the addon check below decides success.
          code=$(curl --max-time 120 -sS -o "$RUNNER_TEMP/stack-start.json" -w '%{http_code}' \
            -X POST "$PHLEET_URL/api/projects/$PHLEET_PROJECT_ID/start" \
            -H "Authorization: Bearer $PHLEET_TOKEN")
          cat "$RUNNER_TEMP/stack-start.json"
          case "$code" in
            200|409) ;;
            *) echo "stack start returned HTTP $code"; exit 1 ;;
          esac

          for _ in $(seq 1 120); do
            view=$(curl --max-time 30 -fsS \
              -H "Authorization: Bearer $PHLEET_TOKEN" \
              "$PHLEET_URL/api/projects/$PHLEET_PROJECT_ID")
            not_running=$(printf '%s' "$view" | jq -r \
              '[.project.addons[]? | select(.status != "running")] | length')
            if [ "$not_running" -eq 0 ]; then
              echo "all stack addons are running"
              exit 0
            fi
            echo "waiting for $not_running addon(s) to start"
            sleep 5
          done
          echo "addons did not start in time"
          exit 1

      - name: Deploy services one at a time
        run: |
          set -euo pipefail
          view=$(curl --max-time 30 -fsS \
            -H "Authorization: Bearer $PHLEET_TOKEN" \
            "$PHLEET_URL/api/projects/$PHLEET_PROJECT_ID")
          services=$(printf '%s' "$view" | jq -r '.project.services[] | "\(.id) \(.name)"')
          test -n "$services" || { echo "stack has no services"; exit 1; }

          while read -r service_id service_name; do
            echo "deploying $service_name ($service_id)"
            payload=$(jq -nc --arg ref "$DEPLOY_REF" '{ref:$ref}')
            response=$(curl --max-time 120 -fsS -X POST \
              "$PHLEET_URL/api/projects/$service_id/deploy" \
              -H "Authorization: Bearer $PHLEET_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload")

            echo "$response"
            failed=$(printf '%s' "$response" | jq -r \
              '[.deployments[] | select(.status == "failed")] | length')
            skipped=$(printf '%s' "$response" | jq -r '.skipped | length')
            if [ "$failed" -gt 0 ] || [ "$skipped" -gt 0 ]; then
              echo "$service_name was refused by phleet; failed=$failed skipped=$skipped"
              exit 1
            fi

            dep_id=$(printf '%s' "$response" | jq -r '.deployments[0].id // empty')
            test -n "$dep_id" || { echo "$service_name returned no deployment id"; exit 1; }
            echo "waiting for $service_name deployment $dep_id"

            status=queued
            for _ in $(seq 1 240); do
              list=$(curl --max-time 30 -fsS \
                -H "Authorization: Bearer $PHLEET_TOKEN" \
                "$PHLEET_URL/api/projects/$service_id/deployments")
              status=$(printf '%s' "$list" | jq -r --arg id "$dep_id" \
                '.deployments[] | select(.id == $id) | .status' | head -n1)
              status=${status:-queued}
              echo "$service_name: $status"
              case "$status" in
                active) break ;;
                failed|rolled_back)
                  echo "$service_name deployment ended as $status"
                  exit 1
                  ;;
              esac
              sleep 5
            done

            if [ "$status" != "active" ]; then
              echo "$service_name deployment timed out"
              exit 1
            fi
          done <<< "$services"

      - name: Verify services are running
        run: |
          set -euo pipefail
          view=$(curl --max-time 30 -fsS \
            -H "Authorization: Bearer $PHLEET_TOKEN" \
            "$PHLEET_URL/api/projects/$PHLEET_PROJECT_ID")
          not_running=$(printf '%s' "$view" | jq -r \
            '[.project.services[] | select((.placements[0].status // "") != "running") | .name] | join(", ")')
          if [ -n "$not_running" ]; then
            echo "services not running: $not_running"
            exit 1
          fi
          echo "all stack services are running"
