packages:
  - 'apps/*'
  - 'libs/*'
# Only esbuild needs a postinstall script (tsx uses its platform binary).
# Prisma is generated once on a development machine and the output is
# committed; the phone must never download a native Prisma engine.
onlyBuiltDependencies:
  - esbuild
minimumReleaseAgeExclude:
  - framer-motion@14.5.0
  - motion-dom@14.5.0
  - motion@14.5.0
overrides:
  dompurify: '>=3.4.17'
  body-parser: '>=2.4.0'
  '@graphql-tools/utils': '>=12.0.2'
  lodash-es: '>=4.18.0'
  effect: '^3.20.0'
  source-map-js: '>=1.2.2'
  deepmerge-ts: '>=8.0.0'
