# Docker Compose: Production multi-service orchestration for GlobalPulse.
# NOTE: Docker exposes services on 3000/3001/3002. For local dev (pnpm dev:*),
# ports are configured via .env (default: 4000/4001).

services:
  # 1. PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: globalpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-ai_news}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ai_news']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis 7 for high-throughput job queue and SSE broker
  redis:
    image: redis:7-alpine
    container_name: globalpulse_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Database Schema Initialization & Bootstrap Seed
  db-setup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ai_news}?schema=public
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      [
        'sh',
        '-c',
        'pnpm --filter @ai-news/database exec prisma db push --schema=prisma/schema.prisma && pnpm --filter @ai-news/database exec prisma db execute --schema=prisma/schema.prisma --file=prisma/bootstrap.sql',
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # 4. Production NestJS API Gateway & Mercurius GraphQL API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: globalpulse_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_ENGINE: prisma
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ai_news}?schema=public
      REDIS_URL: redis://redis:6379
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:3001/mcp}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://auth.globalpulse.news}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-https://api.globalpulse.news}
      # Backblaze B2 / S3 Object Storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-005}
      S3_BUCKET: ${S3_BUCKET:-news-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production}
      JWT_ISSUER: https://auth.globalpulse.news
      JWT_AUDIENCE: https://api.globalpulse.news
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # 5. Remote Model Context Protocol (MCP) Server (Streamable HTTP / JSON-RPC 2.0)
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: globalpulse_mcp
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      MCP_PORT: 3001
      MCP_HOST: 0.0.0.0
      HOST: 0.0.0.0
      API_BASE_URL: ${API_BASE_URL:-http://api:3000}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://localhost:3001/mcp}
      OAUTH_ISSUER: ${OAUTH_ISSUER:-https://auth.globalpulse.news}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-https://api.globalpulse.news}
      DEV_TOKEN_ADMIN: ${DEV_TOKEN_ADMIN:-}
      DATABASE_ENGINE: prisma
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ai_news}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set for production}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      api:
        condition: service_started

  # 6. Flagship Next.js 15 Web Portal, CMS & 4K Display Wall
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: globalpulse_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_MCP_URL: ${NEXT_PUBLIC_MCP_URL:-http://localhost:3001/mcp}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '3002:3002'
    depends_on:
      - api

  # 7. Asynchronous Background Worker Queue (BullMQ, 4K media variants, TTS audio)
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: globalpulse_worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_ENGINE: prisma
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-ai_news}?schema=public
      # Backblaze B2 / S3 Object Storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-005}
      S3_BUCKET: ${S3_BUCKET:-news-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
